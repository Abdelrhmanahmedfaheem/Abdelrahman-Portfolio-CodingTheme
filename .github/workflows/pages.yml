name: Deploy original portfolio ZIP to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Extract original portfolio ZIP
        run: |
          python - <<'PY'
          import os, zipfile
          archive = 'Abdelrahman_Portfolio_CodingTheme.zip'
          os.makedirs('site', exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename.replace('\\\\', '/')
                  if not name or name.startswith('/') or '..' in name.split('/'):
                      continue
                  target = os.path.join('site', name)
                  if item.is_dir():
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)
                      with z.open(item) as src, open(target, 'wb') as dst:
                          dst.write(src.read())
          assert os.path.isfile('site/index.html'), 'Original ZIP did not contain index.html'
          PY
      - name: Upload original site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
